<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="titulo">
            <h1>Cubos de Rubik Baratos</h1>
        </div>
        <div>
            <input type="text" placeholder="Buscar cubo de Rubik..." class="busqueda">
        </div>
    </header>
    <nav >
        <a href="" class="Navegacion">Cubos 2x2</a>
        <a href="" class="Navegacion">Cubos 3x3</a>
        <a href="" class="Navegacion">Cubos 4x4</a>
        <a href="" class="Navegacion">Cubos 5x5</a>
        
    </nav>
<aside class="filtros">
  <h2 class="filtros-titulo">Filtros</h2>

  <div class="filtro">
    <h3 class="filtros-subtitulo">Tipo de cubo</h3>
    <label class="filtros-opcion">
      <input type="checkbox"> 2x2
    </label>
    <label class="filtros-opcion">
      <input type="checkbox"> 3x3
    </label>
    <label class="filtros-opcion">
      <input type="checkbox"> 4x4
    </label>
    <label class="filtros-opcion">
      <input type="checkbox"> 5x5
    </label>
  </div>

  <div class="filtro">
    <h3 class="filtros-subtitulo">Precio</h3>
    <label class="filtros-opcion">
      <input type="radio" name="precio"> Menos de 10 €
    </label>
    <label class="filtros-opcion">
      <input type="radio" name="precio"> 10 € - 20 €
    </label>
    <label class="filtros-opcion">
      <input type="radio" name="precio"> Más de 20 €
    </label>
  </div>

  <div class="filtro">
    <h3 class="filtros-subtitulo">Marca</h3>
    <label class="filtros-opcion">
      <input type="checkbox"> Moyu
    </label>
    <label class="filtros-opcion">
      <input type="checkbox"> GAN
    </label>
    <label class="filtros-opcion">
      <input type="checkbox"> QiYi
    </label>
    <label class="filtros-opcion">
      <input type="checkbox"> YJ
    </label>
  </div>

  <button class="boton-filtros">Aplicar filtros</button>
</aside>
 <main class="productos">
  <h2 class="productos-titulo">Cubos de Rubik</h2>

  <div class="lista-productos">

    <div class="producto">
      <img src="img/cubo-2x2.jpg" alt="Cubo de Rubik 2x2">
      <h3 class="producto-nombre">Cubo de Rubik 2x2</h3>
      <p class="producto-precio">7,99 €</p>
      <button class="boton-comprar">Comprar</button>
    </div>

    <div class="producto">
      <img src="img/cubo-3x3.jpg" alt="Cubo de Rubik 3x3">
      <h3 class="producto-nombre">Cubo de Rubik 3x3</h3>
      <p class="producto-precio">9,99 €</p>
      <button class="boton-comprar">Comprar</button>
    </div>

    <div class="producto">
      <img src="img/cubo-4x4.jpg" alt="Cubo de Rubik 4x4">
      <h3 class="producto-nombre">Cubo de Rubik 4x4</h3>
      <p class="producto-precio">14,99 €</p>
      <button class="boton-comprar">Comprar</button>
    </div>

    <div class="producto">
      <img src="img/cubo-5x5.jpg" alt="Cubo de Rubik 5x5">
      <h3 class="producto-nombre">Cubo de Rubik 5x5</h3>
      <p class="producto-precio">19,99 €</p>
      <button class="boton-comprar">Comprar</button>
    </div>

    <div class="producto">
      <img src="img/cubo-magnetico.jpg" alt="Cubo de Rubik magnético">
      <h3 class="producto-nombre">Cubo Magnético 3x3</h3>
      <p class="producto-precio">24,99 €</p>
      <button class="boton-comprar">Comprar</button>
    </div>

    <div class="producto">
      <img src="img/cubo-profesional.jpg" alt="Cubo de Rubik profesional">
      <h3 class="producto-nombre">Cubo Profesional</h3>
      <p class="producto-precio">29,99 €</p>
      <button class="boton-comprar">Comprar</button>
    </div>

  </div>
</main>
</body>
</html>
